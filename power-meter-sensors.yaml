sensor:
  - platform: homeassistant
    id: sensor_pv_power_1
    entity_id: sensor.goodwe_pv_power
    on_value:
      - script.execute:
          id: update_pv_power_1
          x: !lambda return x;

  - platform: homeassistant
    id: sensor_pv_power_2
    entity_id: sensor.goodwe_white_pv_power
    on_value:
      - script.execute:
          id: update_pv_power_2
          x: !lambda return x;

  - platform: combination
    type: sum
    id: sensor_pv_power_total
    sources:
      - source: sensor_pv_power_1
      - source: sensor_pv_power_2
    on_value:
      - script.execute:
          id: update_pv_power_total
          x: !lambda return x;

  - platform: homeassistant
    id: sensor_battery_power_1
    entity_id: sensor.goodwe_battery_power
    on_value:
      - script.execute:
          id: update_battery_power_1
          x: !lambda return x;

  - platform: homeassistant
    id: sensor_battery_power_2
    entity_id: sensor.goodwe_white_battery_power

    on_value:
      - script.execute:
          id: update_battery_power_2
          x: !lambda return x;

  - platform: combination
    type: sum
    id: sensor_battery_power_total
    sources:
      - source: sensor_battery_power_1
      - source: sensor_battery_power_2
    on_value:
      - script.execute:
          id: update_battery_power_total
          x: !lambda return x;

  - platform: homeassistant
    id: sensor_battery_charge_1
    entity_id: sensor.goodwe_battery_state_of_charge
    on_value:
      - script.execute:
          id: update_battery_charge_1
          x: !lambda return x;

  - platform: homeassistant
    id: sensor_battery_charge_2
    entity_id: sensor.goodwe_white_battery_charge_state
    on_value:
      - script.execute:
          id: update_battery_charge_2
          x: !lambda return x;

  - platform: combination
    type: linear
    id: sensor_battery_charge_total
    sources:
      - source: sensor_battery_charge_1
        coefficient: 0.46
      - source: sensor_battery_charge_2
        coefficient: 0.53
    on_value:
      - script.execute:
          id: update_battery_charge_total
          x: !lambda return x;


  - platform: homeassistant
    id: inverter_2_battery_charge_state
    entity_id: sensor.goodwe_white_battery_charge_state

  - platform: homeassistant
    id: jakiper_charge_state
    name: Jakiper Charge State
    entity_id: sensor.bms_jakiper_charge
  - platform: homeassistant
    id: byd_charge_state
    name: BYD Charge State
    entity_id: sensor.bms_byd_charge

#  - platform: homeassistant
#    id: inverter_1_battery_charge_state
#    entity_id: sensor.battery_state_of_charge

  # Average of the two BMS readings; if one is unavailable use the other,
  # and if both are, fall back to the inverter's own SOC (may be NaN).
  - platform: template
    id: inverter_1_battery_charge_state
    update_interval: 10s
    lambda: |-
      const float byd = id(byd_charge_state).state;
      const float jak = id(jakiper_charge_state).state;
      if (!std::isnan(byd) && !std::isnan(jak))
        return (byd + jak) / 2.0f;
      if (!std::isnan(byd))
        return byd;
      if (!std::isnan(jak))
        return jak;
      return id(sensor_battery_charge_1).state;


